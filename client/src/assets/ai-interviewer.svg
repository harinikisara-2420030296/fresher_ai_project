<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" className="w-full h-full object-cover rounded-2xl">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E26" />
      <stop offset="50%" stop-color="#2A2A38" />
      <stop offset="100%" stop-color="#181820" />
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="yellowTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5" />
      <stop offset="100%" stop-color="#EBB38D" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1A12" />
      <stop offset="100%" stop-color="#1A0D08" />
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
  </defs>

  <!-- Background Office Scene -->
  <rect width="600" height="450" fill="url(#bgGrad)" />

  <!-- Office Window & Abstract City Glow -->
  <rect x="40" y="30" width="220" height="240" rx="12" fill="url(#windowGlow)" stroke="#374151" stroke-width="2" />
  <line x1="150" y1="30" x2="150" y2="270" stroke="#374151" stroke-width="2" />
  <line x1="40" y1="150" x2="260" y2="150" stroke="#374151" stroke-width="2" />

  <!-- Window skyline silhouettes -->
  <rect x="60" y="160" width="25" height="110" fill="#312E81" opacity="0.4" />
  <rect x="95" y="130" width="35" height="140" fill="#312E81" opacity="0.5" />
  <rect x="140" y="170" width="20" height="100" fill="#312E81" opacity="0.4" />
  <rect x="170" y="140" width="30" height="130" fill="#312E81" opacity="0.5" />
  <rect x="210" y="180" width="30" height="90" fill="#312E81" opacity="0.4" />

  <!-- Indoor Plant in Office Corner -->
  <path d="M520,320 Q540,240 510,210 Q490,250 510,320 Z" fill="#10B981" opacity="0.8" />
  <path d="M530,320 Q570,250 550,220 Q530,260 525,320 Z" fill="#059669" opacity="0.9" />
  <path d="M510,320 Q480,260 495,230 Q515,270 515,320 Z" fill="#34D399" opacity="0.7" />
  <polygon points="500,320 540,320 535,370 505,370" fill="#4B5563" />

  <!-- Modern Desk -->
  <polygon points="0,380 600,380 600,450 0,450" fill="#1F2430" />
  <line x1="0" y1="380" x2="600" y2="380" stroke="#3B4252" stroke-width="3" />

  <!-- Coffee Mug -->
  <rect x="420" y="340" width="28" height="36" rx="4" fill="#E5E7EB" />
  <path d="M448,348 Q460,355 448,365" stroke="#E5E7EB" stroke-width="4" fill="none" />
  <rect x="424" y="344" width="20" height="4" rx="2" fill="#D97706" />

  <!-- Interviewer Character Body -->
  <!-- Hair back -->
  <path d="M250,110 C230,160 220,240 240,280 C260,240 250,180 255,140 Z" fill="url(#hairGrad)" />
  <path d="M350,110 C370,160 380,240 360,280 C340,240 350,180 345,140 Z" fill="url(#hairGrad)" />

  <!-- Shoulders & Yellow Top -->
  <path d="M220,380 L230,280 C240,240 260,230 300,230 C340,230 360,240 370,280 L380,380 Z" fill="url(#yellowTop)" />

  <!-- Collar details -->
  <polygon points="300,260 280,230 320,230" fill="url(#skinTone)" />
  <path d="M280,230 L300,265 L320,230" stroke="#B45309" stroke-width="2" fill="none" />

  <!-- Neck -->
  <rect x="285" y="195" width="30" height="40" rx="4" fill="url(#skinTone)" />

  <!-- Head / Face -->
  <ellipse cx="300" cy="155" rx="48" ry="58" fill="url(#skinTone)" />

  <!-- Hair front & styling -->
  <path d="M252,145 C250,110 265,80 300,80 C335,80 350,110 348,145 C335,100 320,105 300,105 C275,105 260,115 252,145 Z" fill="url(#hairGrad)" />
  <path d="M250,140 C245,170 255,200 255,200 C250,180 248,160 250,140 Z" fill="url(#hairGrad)" />
  <path d="M350,140 C355,170 345,200 345,200 C350,180 352,160 350,140 Z" fill="url(#hairGrad)" />

  <!-- Facial Features -->
  <!-- Eyebrows -->
  <path d="M272,135 Q285,130 292,136" stroke="#2D1A12" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M308,136 Q315,130 328,135" stroke="#2D1A12" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Eyes - Friendly / Engaged -->
  <ellipse cx="282" cy="148" rx="6" ry="6" fill="#1F2937" />
  <circle cx="284" cy="146" r="2" fill="#FFFFFF" />
  <ellipse cx="318" cy="148" rx="6" ry="6" fill="#1F2937" />
  <circle cx="320" cy="146" r="2" fill="#FFFFFF" />

  <!-- Cheerful Smile -->
  <path d="M288,178 Q300,192 312,178" stroke="#BE123C" stroke-width="3" stroke-linecap="round" fill="#FFFFFF" />
  <!-- Cheeks blush -->
  <ellipse cx="270" cy="165" rx="8" ry="4" fill="#F43F5E" opacity="0.25" />
  <ellipse cx="330" cy="165" rx="8" ry="4" fill="#F43F5E" opacity="0.25" />

  <!-- Glasses (Modern Minimalist Dark Frames) -->
  <rect x="268" y="138" width="28" height="20" rx="6" stroke="#1F2937" stroke-width="2" fill="none" />
  <rect x="304" y="138" width="28" height="20" rx="6" stroke="#1F2937" stroke-width="2" fill="none" />
  <line x1="296" y1="148" x2="304" y2="148" stroke="#1F2937" stroke-width="2" />

  <!-- Arms / Hands typing on Laptop -->
  <ellipse cx="240" cy="350" rx="25" ry="45" fill="url(#yellowTop)" transform="rotate(-25 240 350)" />
  <ellipse cx="360" cy="350" rx="25" ry="45" fill="url(#yellowTop)" transform="rotate(25 360 350)" />

  <!-- Modern Sleek Laptop -->
  <polygon points="230,375 370,375 390,395 210,395" fill="url(#laptopGrad)" stroke="#6B7280" stroke-width="1" />
  <rect x="235" y="300" width="130" height="75" rx="6" fill="#111827" stroke="#9CA3AF" stroke-width="2" />
  <!-- Laptop Screen Glow -->
  <rect x="240" y="305" width="120" height="65" rx="3" fill="#1E293B" />
  <circle cx="300" cy="335" r="14" fill="#3B82F6" opacity="0.4" />
  <path d="M295,335 L305,335 M300,330 L300,340" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
</svg>

