version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fresher-ai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fresher-network

  redis:
    image: redis:7.2-alpine
    container_name: fresher-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - fresher-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: fresher-ai-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - USER_SERVICE_URL=http://user-service:5001
      - RESUME_SERVICE_URL=http://resume-service:5002
      - INTERVIEW_SERVICE_URL=http://interview-service:5003
      - FEEDBACK_SERVICE_URL=http://feedback-service:5004
      - ROADMAP_SERVICE_URL=http://roadmap-service:5005
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - fresher-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: fresher-ai-user-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/fresher_ai
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - fresher-network

  resume-service:
    build:
      context: .
      dockerfile: services/resume-service/Dockerfile
    container_name: fresher-ai-resume-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/fresher_ai
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
    depends_on:
      - mongodb
    networks:
      - fresher-network

  interview-service:
    build:
      context: .
      dockerfile: services/interview-service/Dockerfile
    container_name: fresher-ai-interview-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/fresher_ai
      - REDIS_URL=redis://redis:6379
      - FEEDBACK_SERVICE_URL=http://feedback-service:5004
      - USER_SERVICE_URL=http://user-service:5001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
    depends_on:
      - mongodb
      - redis
    networks:
      - fresher-network

  feedback-service:
    build:
      context: .
      dockerfile: services/feedback-service/Dockerfile
    container_name: fresher-ai-feedback-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongodb:27017/fresher_ai
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
    depends_on:
      - mongodb
      - redis
    networks:
      - fresher-network

  roadmap-service:
    build:
      context: .
      dockerfile: services/roadmap-service/Dockerfile
    container_name: fresher-ai-roadmap-service
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/fresher_ai
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
    depends_on:
      - mongodb
    networks:
      - fresher-network

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: fresher-ai-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - api-gateway
    networks:
      - fresher-network

volumes:
  mongo-data:
  redis-data:

networks:
  fresher-network:
    driver: bridge

